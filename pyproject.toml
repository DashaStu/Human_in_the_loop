[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W — стиль PEP8, F — логические ошибки, I — сортировка импортов
select = ["E", "F", "W", "I"]
# Длинные текстовые строки (промпты, русские сообщения) не считаем ошибкой
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
